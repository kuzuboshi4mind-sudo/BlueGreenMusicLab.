---
title: News
---
{% assign years = site.posts | group_by_exp: "p", "p.date | date: '%Y'" %}
<nav class="year-index">{% for y in years %}<a href="#y{{ y.name }}">{{ y.name }}</a>{% endfor %}</nav>
{% for y in years %}
<section class="year-block" id="y{{ y.name }}">
  <h2>{{ y.name }}<small>{{ y.items | size }}件</small></h2>
  {% include post-list.html posts=y.items %}
</section>
{% endfor %}
