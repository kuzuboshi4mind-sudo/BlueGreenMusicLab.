# Pages CMS（https://pagescms.org）用の設定。
# ブラウザ／スマホからフォーム入力でニュースやライブを更新できます。
media:
  input: assets/img
  output: /assets/img

content:
  - name: posts
    label: ニュース
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{fields.slug}.md"
    view:
      fields: [title, date, category]
    fields:
      - { name: title, label: タイトル, type: string, required: true }
      - { name: slug, label: URL用の英字（例 new-album）, type: string, required: true }
      - { name: date, label: 日付, type: date }
      - name: category
        label: カテゴリ
        type: select
        options: { values: [Info, Live, Release, Media] }
      - { name: image, label: 画像, type: image }
      - { name: youtube, label: YouTube動画ID, type: string }
      - { name: body, label: 本文, type: rich-text }

  - name: lives
    label: ライブ
    type: collection
    path: _lives
    filename: "{year}-{month}-{day}-{fields.slug}.md"
    view:
      fields: [title, date, venue]
    fields:
      - { name: title, label: 公演名, type: string, required: true }
      - { name: slug, label: URL用の英字, type: string, required: true }
      - { name: date, label: 日付, type: date, required: true }
      - { name: venue, label: 会場, type: string }
      - { name: venue_url, label: 会場URL, type: string }
      - { name: time, label: 時間（OPEN/START）, type: string }
      - { name: price, label: 料金, type: string }
      - { name: members, label: 出演, type: string }
      - { name: reserve, label: サイトで予約を受け付ける, type: boolean, default: true }
      - { name: ticket_url, label: 外部のチケット購入URL（あれば）, type: string }
      - name: project
        label: 名義
        type: select
        options: { values: [Solo, 屑星, THE FROGS, Feel Art Cafe, Other] }
      - { name: body, label: 備考, type: rich-text }

  - name: biography
    label: Biography
    type: file
    path: biography/index.md
    fields:
      - { name: title, type: string, hidden: true, default: Biography }
      - { name: body, label: 本文, type: code }

  - name: videos
    label: 動画
    type: file
    path: _data/videos.yml
    list: true
    fields:
      - { name: id, label: YouTube動画ID（youtu.be/の後ろ）, type: string }
      - { name: title, label: タイトル, type: string }
      - name: category
        label: 名義
        type: select
        options: { values: [Solo, 屑星, THE FROGS, Feel Art Cafe, Other] }

  - name: projects
    label: プロジェクト
    type: file
    path: _data/projects.yml
    list: true
    fields:
      - { name: name, label: 名前, type: string }
      - { name: sub, label: サブタイトル, type: string }
      - { name: image, label: 画像, type: image }
      - { name: body, label: 紹介文, type: text }
      - name: links
        label: リンク
        type: object
        list: true
        fields:
          - { name: name, label: 表示名, type: string }
          - { name: url, label: URL, type: string }

  - name: sns
    label: SNSリンク
    type: file
    path: _data/sns.yml
    list: true
    fields:
      - { name: name, label: 名前, type: string }
      - { name: icon, label: アイコン（instagram/x/youtube/facebook/line/music）, type: string }
      - { name: url, label: URL, type: string }

  - name: discography
    label: ディスコグラフィー
    type: file
    path: _data/discography.yml
    list: true
    fields:
      - { name: title, label: タイトル, type: string }
      - { name: artist, label: 名義（Solo/屑星/THE FROGS…）, type: string }
      - { name: type, label: 種別, type: string }
      - { name: release, label: 発売日（例 2018-09-16）, type: string }
      - { name: catalog, label: 品番, type: string }
      - { name: price, label: 価格, type: string }
      - { name: note, label: 紹介文, type: text }
      - { name: youtube, label: YouTube動画ID, type: string }
      - { name: cover, label: ジャケット, type: image }
      - { name: tracks, label: 曲目, type: string, list: true }
      - name: links
        label: 配信リンク
        type: object
        list: true
        fields:
          - { name: name, label: サービス名, type: string }
          - { name: url, label: URL, type: string }
